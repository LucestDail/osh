<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSH · AI 대시보드</title>

    <link rel="stylesheet" th:href="@{/css/tokens.css}"     href="/css/tokens.css">
    <link rel="stylesheet" th:href="@{/css/base.css}"       href="/css/base.css">
    <link rel="stylesheet" th:href="@{/css/components.css}" href="/css/components.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}"  href="/css/dashboard.css">

    <script>
      (function () {
        try {
          var t = localStorage.getItem('osh.theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* noop */ }
      })();
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<script th:inline="javascript">
  window.CTX = /*[[@{/}]]*/ '/';
</script>

<nav class="app-navbar">
    <div class="app-navbar__inner">
        <a class="app-navbar__brand" th:href="@{/}" href="/">OSH</a>
        <div class="app-navbar__links">
            <a class="app-navbar__link"           th:href="@{/}" href="/">메인 대시보드</a>
            <a class="app-navbar__link is-active" th:href="@{/dashboard}" href="/dashboard">AI 대시보드</a>
        </div>
        <div class="app-navbar__actions">
            <button class="theme-toggle" type="button" data-theme-toggle aria-label="다크/라이트 모드 전환"></button>
        </div>
    </div>
</nav>

<main class="page">

    <header class="page__header">
        <div>
            <h1 class="page__title">AI 기반 대시보드 요약</h1>
            <p class="page__subtitle">Gemini 가 수집된 뉴스 · 날씨 · 재난 · 교통 데이터를 종합 분석합니다</p>
        </div>
        <div class="page__clock"><span aria-hidden="true">⏱</span><span id="last-update">대기 중</span></div>
    </header>

    <article class="card">
        <header class="card__header">
            <h2 class="card__title"><span class="card__icon">🧠</span>종합 분석 보고서</h2>
        </header>
        <div class="card__body">
            <div id="errorBanner" class="empty-state empty-state--danger" style="display:none"></div>
            <div id="dashboard-content" class="markdown">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <div class="loading-message">데이터를 수집하고 있습니다 · 처음에는 30초 이상 걸릴 수 있습니다</div>
                </div>
            </div>
        </div>
    </article>
</main>

<script th:src="@{/js/core/theme.js}" src="/js/core/theme.js"></script>
<script>
(function () {
    'use strict';
    const ctx = window.CTX || '/';
    const LOADING_MSGS = [
        '뉴스를 분석하고 있어요 · 📰',
        '날씨 데이터를 수집하는 중 · 🌤',
        '긴급 상황을 확인하고 있어요 · 🚨',
        '교통 정보를 분석하는 중 · 🚗',
        '데이터를 종합하고 있어요 · 📊',
        '거의 다 왔어요 · ⏳'
    ];

    let cycleTimer = null;

    function startLoading() {
        const host = document.getElementById('dashboard-content');
        host.innerHTML =
            '<div class="loading-container">' +
                '<div class="loading-spinner"></div>' +
                '<div class="loading-message" id="loadingMsg">' + LOADING_MSGS[0] + '</div>' +
            '</div>';
        let i = 0;
        clearInterval(cycleTimer);
        cycleTimer = setInterval(function () {
            i = (i + 1) % LOADING_MSGS.length;
            const el = document.getElementById('loadingMsg');
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(function () { el.textContent = LOADING_MSGS[i]; el.style.opacity = '1'; }, 200);
        }, 2500);
    }

    function stopLoading() { clearInterval(cycleTimer); cycleTimer = null; }

    function showError(msg) {
        const b = document.getElementById('errorBanner');
        b.style.display = 'block';
        b.innerHTML = '<div class="empty-state__title">불러오기 실패</div>' +
                      '<div class="empty-state__hint">' + (msg || '') + '</div>';
    }

    function render(markdown) {
        stopLoading();
        const host = document.getElementById('dashboard-content');
        host.innerHTML = (typeof marked !== 'undefined') ? marked.parse(markdown) : markdown;
        document.getElementById('last-update').textContent =
            '마지막 업데이트 · ' + new Date().toLocaleString('ko-KR');
    }

    function fetchSummary() {
        document.getElementById('errorBanner').style.display = 'none';
        startLoading();
        fetch(ctx + 'api/gemini/dashboard-summary')
            .then(function (r) {
                if (!r.ok) return r.text().then(function (t) { throw new Error(t || 'HTTP ' + r.status); });
                return r.text();
            })
            .then(function (text) {
                if (!text || text.startsWith('대시보드 요약을 생성하는 중 오류') || text.startsWith('데이터를 불러오는 중 오류')) {
                    throw new Error(text || '데이터 없음');
                }
                render(text);
            })
            .catch(function (e) { stopLoading(); showError(e.message); });
    }

    function init() {
        fetchSummary();
        setInterval(fetchSummary, 5 * 60 * 1000); // 5분 주기
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
