<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSH · 실시간 안전 운영 대시보드</title>

    <link rel="stylesheet" th:href="@{/css/tokens.css}"     href="/css/tokens.css">
    <link rel="stylesheet" th:href="@{/css/base.css}"       href="/css/base.css">
    <link rel="stylesheet" th:href="@{/css/components.css}" href="/css/components.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}"  href="/css/dashboard.css">

    <script>
      (function () {
        try {
          var t = localStorage.getItem('osh.theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* noop */ }
      })();
    </script>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />
    <script defer
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
</head>
<body>

<script th:inline="javascript">
  window.CTX = /*[[@{/}]]*/ '/';
</script>

<nav class="app-navbar">
    <div class="app-navbar__inner">
        <a class="app-navbar__brand" th:href="@{/}" href="/">OSH</a>
        <div class="app-navbar__title">실시간 안전 운영 대시보드</div>
        <div class="app-navbar__actions">
            <div class="page__clock"><span aria-hidden="true">⏱</span><span id="currentTime">--:--:--</span></div>
            <button class="theme-toggle" type="button" data-theme-toggle aria-label="다크/라이트 모드 전환"></button>
        </div>
    </div>
</nav>

<!-- 서버 지표 status bar (헤더 바로 아래, 한 줄) -->
<div class="status-bar" id="statusBar">
    <div class="status-bar__inner">
        <span class="status-bar__item" title="OS">
            <span class="status-bar__label">OS</span>
            <span class="status-bar__val" id="systemName">-</span>
        </span>
        <span class="status-bar__item" title="아키텍처">
            <span class="status-bar__label">ARCH</span>
            <span class="status-bar__val" id="systemArchitecture">-</span>
        </span>
        <span class="status-bar__item" title="시스템 평균 부하">
            <span class="status-bar__label">LOAD</span>
            <span class="status-bar__val" id="systemLoad">-</span>
        </span>
        <span class="status-bar__item status-bar__item--bar" title="JVM 메모리">
            <span class="status-bar__label">MEM</span>
            <span class="status-bar__bar"><span class="status-bar__bar-fill" id="memBarFill"></span></span>
            <span class="status-bar__val" id="memText">- / -</span>
        </span>
    </div>
</div>

<main class="page">
    <section class="grid grid--tri">

        <!-- (1) 전국 지도 -->
        <article class="card card--fixed" id="mapCard">
            <header class="card__header">
                <h2 class="card__title">
                    <span class="card__icon">🗺</span>전국 상황 지도
                </h2>
                <div class="card__header-aux">
                    <span class="badge">19도시 · 재난 · 교통</span>
                    <button class="btn btn--ghost btn--sm" id="mapFsBtn" title="전체화면 (ESC 해제)">⛶</button>
                </div>
            </header>
            <div class="card__body card__body--flush card__body--map" id="mapBody">
                <div id="mapCanvas"></div>
            </div>
        </article>

        <!-- (2) AI 한줄 브리핑 -->
        <article class="card card--fixed">
            <header class="card__header">
                <h2 class="card__title">
                    <span class="card__icon">🤖</span>AI 한줄 브리핑
                </h2>
                <div class="card__header-aux">
                    <span class="badge" id="splitUpdated">대기 중</span>
                    <button class="btn btn--ghost btn--sm" type="button" id="splitRefreshBtn" title="새로고침">↻</button>
                </div>
            </header>
            <div class="card__body">
                <div class="split-list">
                    <div class="split-row"><span class="split-row__tag">☁ 날씨</span><span class="split-row__text" id="splitWeather">불러오는 중…</span></div>
                    <div class="split-row"><span class="split-row__tag">💨 대기질</span><span class="split-row__text" id="splitAir">불러오는 중…</span></div>
                    <div class="split-row"><span class="split-row__tag">⚠ 재난</span><span class="split-row__text" id="splitEmergency">불러오는 중…</span></div>
                    <div class="split-row"><span class="split-row__tag">🚧 교통</span><span class="split-row__text" id="splitTraffic">불러오는 중…</span></div>
                    <div class="split-row"><span class="split-row__tag">📰 뉴스</span><span class="split-row__text" id="splitNews">불러오는 중…</span></div>
                </div>
            </div>
        </article>

        <!-- (3) 정보 탭 카드 -->
        <article class="card card--fixed">
            <header class="card__header">
                <nav class="info-tabs" role="tablist">
                    <button class="info-tab is-active" role="tab" data-tab="weather"
                            aria-controls="panel-weather">☁ 기상</button>
                    <button class="info-tab" role="tab" data-tab="air"
                            aria-controls="panel-air">💨 대기질</button>
                    <button class="info-tab" role="tab" data-tab="emergency"
                            aria-controls="panel-emergency">⚠ 재난</button>
                    <button class="info-tab" role="tab" data-tab="traffic"
                            aria-controls="panel-traffic">🚧 교통</button>
                    <button class="info-tab" role="tab" data-tab="news"
                            aria-controls="panel-news">📰 뉴스</button>
                </nav>
                <span class="live-pill" id="liveAll" title="실시간 연결 상태"></span>
            </header>

            <div class="card__body card__body--tabs">
                <!-- weather -->
                <section class="info-panel is-active" id="panel-weather" role="tabpanel">
                    <div class="info-panel__content"><div id="weatherGrid" class="weather-grid"></div></div>
                    <div class="pager" data-pager="weather">
                        <button class="pager__btn" data-act="prev" aria-label="이전">‹</button>
                        <span class="pager__label" id="pagerLabel-weather">0 / 0</span>
                        <button class="pager__btn" data-act="next" aria-label="다음">›</button>
                    </div>
                </section>

                <!-- air -->
                <section class="info-panel" id="panel-air" role="tabpanel" hidden>
                    <div class="info-panel__content"><div id="airGrid" class="air-grid"></div></div>
                    <div class="pager" data-pager="air">
                        <button class="pager__btn" data-act="prev" aria-label="이전">‹</button>
                        <span class="pager__label" id="pagerLabel-air">0 / 0</span>
                        <button class="pager__btn" data-act="next" aria-label="다음">›</button>
                    </div>
                </section>

                <!-- emergency -->
                <section class="info-panel" id="panel-emergency" role="tabpanel" hidden>
                    <div class="info-panel__content">
                        <table class="table table--tight">
                            <thead>
                                <tr>
                                    <th style="width:96px">시각</th>
                                    <th style="width:110px">지역</th>
                                    <th>메시지</th>
                                    <th style="width:60px">단계</th>
                                </tr>
                            </thead>
                            <tbody id="emergencyTbody"></tbody>
                        </table>
                    </div>
                    <div class="pager" data-pager="emergency">
                        <button class="pager__btn" data-act="prev" aria-label="이전">‹</button>
                        <span class="pager__label" id="pagerLabel-emergency">0 / 0</span>
                        <button class="pager__btn" data-act="next" aria-label="다음">›</button>
                    </div>
                </section>

                <!-- traffic -->
                <section class="info-panel" id="panel-traffic" role="tabpanel" hidden>
                    <div class="info-panel__content">
                        <table class="table table--tight">
                            <thead>
                                <tr>
                                    <th style="width:96px">발생</th>
                                    <th>도로</th>
                                    <th>내용</th>
                                    <th style="width:80px">유형</th>
                                </tr>
                            </thead>
                            <tbody id="trafficTbody"></tbody>
                        </table>
                    </div>
                    <div class="pager" data-pager="traffic">
                        <button class="pager__btn" data-act="prev" aria-label="이전">‹</button>
                        <span class="pager__label" id="pagerLabel-traffic">0 / 0</span>
                        <button class="pager__btn" data-act="next" aria-label="다음">›</button>
                    </div>
                </section>

                <!-- news -->
                <section class="info-panel" id="panel-news" role="tabpanel" hidden>
                    <div class="info-panel__content">
                        <table class="table table--tight">
                            <thead>
                                <tr>
                                    <th style="width:96px">시각</th>
                                    <th style="width:32%">제목</th>
                                    <th>내용</th>
                                </tr>
                            </thead>
                            <tbody id="newsTbody"></tbody>
                        </table>
                    </div>
                    <div class="pager" data-pager="news">
                        <button class="pager__btn" data-act="prev" aria-label="이전">‹</button>
                        <span class="pager__label" id="pagerLabel-news">0 / 0</span>
                        <button class="pager__btn" data-act="next" aria-label="다음">›</button>
                    </div>
                </section>
            </div>
        </article>

    </section>
</main>

<!-- core helpers -->
<script th:src="@{/js/core/helpers.js}"     src="/js/core/helpers.js"></script>
<script th:src="@{/js/core/pager.js}"       src="/js/core/pager.js"></script>
<script th:src="@{/js/core/eventSource.js}" src="/js/core/eventSource.js"></script>
<script th:src="@{/js/core/theme.js}"       src="/js/core/theme.js"></script>

<!-- parsers -->
<script th:src="@{/js/parsers/application.js}" src="/js/parsers/application.js"></script>
<script th:src="@{/js/parsers/weather.js}"     src="/js/parsers/weather.js"></script>
<script th:src="@{/js/parsers/emergency.js}"   src="/js/parsers/emergency.js"></script>
<script th:src="@{/js/parsers/traffic.js}"     src="/js/parsers/traffic.js"></script>
<script th:src="@{/js/parsers/news.js}"        src="/js/parsers/news.js"></script>
<script th:src="@{/js/parsers/air.js}"         src="/js/parsers/air.js"></script>
<script th:src="@{/js/parsers/map.js}"         src="/js/parsers/map.js"></script>

<!-- entry -->
<script th:src="@{/js/main-dashboard.js}" src="/js/main-dashboard.js"></script>
</body>
</html>
