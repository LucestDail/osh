<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSH · 메인 대시보드</title>

    <link rel="stylesheet" th:href="@{/css/tokens.css}"     href="/css/tokens.css">
    <link rel="stylesheet" th:href="@{/css/base.css}"       href="/css/base.css">
    <link rel="stylesheet" th:href="@{/css/components.css}" href="/css/components.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}"  href="/css/dashboard.css">

    <!-- 사전 적용된 테마(localStorage) — flash 방지 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('osh.theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* noop */ }
      })();
    </script>

    <!-- Chart.js (서버 정보 doughnut) -->
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- context-path 자동 prepend -->
<script th:inline="javascript">
  window.CTX = /*[[@{/}]]*/ '/';
</script>

<nav class="app-navbar">
    <div class="app-navbar__inner">
        <a class="app-navbar__brand" th:href="@{/}" href="/">OSH</a>
        <div class="app-navbar__links">
            <a class="app-navbar__link is-active" th:href="@{/}" href="/">메인 대시보드</a>
            <a class="app-navbar__link"           th:href="@{/dashboard}" href="/dashboard">AI 대시보드</a>
        </div>
        <div class="app-navbar__actions">
            <button class="theme-toggle" type="button" data-theme-toggle aria-label="다크/라이트 모드 전환"></button>
        </div>
    </div>
</nav>

<main class="page">

    <header class="page__header">
        <div>
            <h1 class="page__title">실시간 안전 운영 대시보드</h1>
            <p class="page__subtitle">기상 · 재난문자 · 교통돌발 · 뉴스 · 서버 지표를 한눈에</p>
        </div>
        <div class="page__clock"><span aria-hidden="true">⏱</span><span id="currentTime">--:--:--</span></div>
    </header>

    <section class="grid">

        <!-- 19도시 날씨 카드 그리드 (가장 넓게) -->
        <article class="card col-12">
            <header class="card__header">
                <h2 class="card__title">
                    <span class="card__icon">☁</span>
                    실시간 기상정보
                    <span class="badge badge--primary">19 도시</span>
                </h2>
                <span class="live-pill" id="liveMain"></span>
            </header>
            <div class="card__body">
                <div id="weatherGrid" class="weather-grid">
                    <div class="empty-state"><div class="empty-state__title">날씨 정보를 불러오는 중입니다</div></div>
                </div>
            </div>
        </article>

        <!-- 긴급재난문자 -->
        <article class="card col-6">
            <header class="card__header">
                <h2 class="card__title"><span class="card__icon">⚠</span>긴급재난문자</h2>
                <span class="live-pill" id="liveEmergency"></span>
            </header>
            <div class="card__body card__body--flush">
                <div class="table--scroll-y">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width:140px">발송시각</th>
                                <th style="width:160px">지역</th>
                                <th>메시지</th>
                                <th style="width:80px">단계</th>
                                <th style="width:100px">유형</th>
                            </tr>
                        </thead>
                        <tbody id="emergencyTbody">
                            <tr><td colspan="5"><div class="empty-state"><div class="empty-state__title">데이터를 불러오는 중입니다</div></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </article>

        <!-- 교통돌발 -->
        <article class="card col-6">
            <header class="card__header">
                <h2 class="card__title"><span class="card__icon">🚧</span>교통돌발상황</h2>
                <span class="live-pill" id="liveTraffic"></span>
            </header>
            <div class="card__body card__body--flush">
                <div class="table--scroll-y">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width:140px">발생시각</th>
                                <th>도로명</th>
                                <th style="width:80px">방향</th>
                                <th>내용</th>
                                <th style="width:80px">유형</th>
                                <th style="width:100px">상세</th>
                            </tr>
                        </thead>
                        <tbody id="trafficTbody">
                            <tr><td colspan="6"><div class="empty-state"><div class="empty-state__title">데이터를 불러오는 중입니다</div></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </article>

        <!-- 뉴스 -->
        <article class="card col-8">
            <header class="card__header">
                <h2 class="card__title"><span class="card__icon">📰</span>실시간 뉴스</h2>
                <span class="live-pill" id="liveNews"></span>
            </header>
            <div class="card__body card__body--flush">
                <div class="table--scroll-y">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width:140px">시각</th>
                                <th style="width:24%">제목</th>
                                <th>내용</th>
                            </tr>
                        </thead>
                        <tbody id="newsTbody">
                            <tr><td colspan="3"><div class="empty-state"><div class="empty-state__title">뉴스를 불러오는 중입니다</div></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </article>

        <!-- 서버 정보 -->
        <article class="card col-4">
            <header class="card__header">
                <h2 class="card__title"><span class="card__icon">⚙</span>서버 지표</h2>
            </header>
            <div class="card__body">
                <div class="chart-wrap"><canvas id="memoryChart"></canvas></div>
                <div class="server-grid">
                    <div class="server-cell">
                        <div class="server-cell__label">아키텍처</div>
                        <div class="server-cell__value" id="systemArchitecture">-</div>
                    </div>
                    <div class="server-cell">
                        <div class="server-cell__label">OS</div>
                        <div class="server-cell__value" id="systemName">-</div>
                    </div>
                    <div class="server-cell">
                        <div class="server-cell__label">Load Avg</div>
                        <div class="server-cell__value" id="systemLoad">-</div>
                    </div>
                    <div class="server-cell">
                        <div class="server-cell__label">총 메모리</div>
                        <div class="server-cell__value" id="totalMemory">-</div>
                    </div>
                    <div class="server-cell">
                        <div class="server-cell__label">사용 중</div>
                        <div class="server-cell__value" id="usedMemory">-</div>
                    </div>
                    <div class="server-cell">
                        <div class="server-cell__label">여유</div>
                        <div class="server-cell__value" id="freeMemory">-</div>
                    </div>
                </div>
            </div>
        </article>

    </section>
</main>

<!-- core helpers -->
<script th:src="@{/js/core/helpers.js}"     src="/js/core/helpers.js"></script>
<script th:src="@{/js/core/eventSource.js}" src="/js/core/eventSource.js"></script>
<script th:src="@{/js/core/theme.js}"       src="/js/core/theme.js"></script>

<!-- parsers -->
<script th:src="@{/js/parsers/application.js}" src="/js/parsers/application.js"></script>
<script th:src="@{/js/parsers/weather.js}"     src="/js/parsers/weather.js"></script>
<script th:src="@{/js/parsers/emergency.js}"   src="/js/parsers/emergency.js"></script>
<script th:src="@{/js/parsers/traffic.js}"     src="/js/parsers/traffic.js"></script>
<script th:src="@{/js/parsers/news.js}"        src="/js/parsers/news.js"></script>

<!-- entry -->
<script th:src="@{/js/main-dashboard.js}" src="/js/main-dashboard.js"></script>
</body>
</html>
