# Application Name
spring.application.name=osh

# === Primary Database ===
# \uc6b4\uc601\uc5d0\uc11c\ub294 DB_*  \ud658\uacbd\ubcc0\uc218\ub85c override (\uc608: systemd EnvironmentFile)
spring.datasource.url=${DB_URL:jdbc:mysql://REDACTED_DB_HOST:53306/dailydata?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&autoReconnect=true&failOverReadOnly=false&maxReconnects=10}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Configuration for Primary DataSource
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# === News Database ===
spring.datasource.news.jdbc-url=${NEWS_DB_URL:jdbc:mysql://REDACTED_DB_HOST:53306/mytools?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&autoReconnect=true&failOverReadOnly=false&maxReconnects=10}
spring.datasource.news.username=${NEWS_DB_USERNAME:admin}
spring.datasource.news.password=${NEWS_DB_PASSWORD:admin}
spring.datasource.news.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Configuration for News DataSource
spring.datasource.news.hikari.connection-timeout=30000
spring.datasource.news.hikari.maximum-pool-size=5
spring.datasource.news.hikari.minimum-idle=1
spring.datasource.news.hikari.idle-timeout=600000
spring.datasource.news.hikari.max-lifetime=1800000
spring.datasource.news.hikari.connection-test-query=SELECT 1
spring.datasource.news.hikari.validation-timeout=5000
spring.datasource.news.hikari.leak-detection-threshold=60000

# Primary JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=none

# News JPA Configuration
spring.jpa.news.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.news.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.news.hibernate.ddl-auto=none
spring.jpa.news.properties.hibernate.format_sql=true

# === Server ===
# \ud1b5\ud569 nginx \uac8c\uc774\ud2b8\uc6e8\uc774 \ub4a4\uc5d0 \ub458 \ub54c: /osh \ucee8\ud14d\uc2a4\ud2b8.
# \ub2e8\ub3c5 \uc2e4\ud589 \uc6d0\ud558\uba74 SERVER_SERVLET_CONTEXT_PATH= \ube48 \uac12\uc73c\ub85c override.
# myapi(8080)\uc640 \ucda9\ub3cc\ud558\uc9c0 \uc54a\ub3c4\ub85d \uae30\ubcf8 \ud3ec\ud2b8\ub294 9080.
server.port=${SERVER_PORT:9080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/osh}
server.forward-headers-strategy=framework

# === Logging ===
# \uc6b4\uc601 \uae30\ubcf8 INFO. \ub514\ubc84\uadf9 \ud544\uc694 \uc2dc LOG_LEVEL_APP=DEBUG \ud658\uacbd\ubcc0\uc218.
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.project.osh=${LOG_LEVEL_APP:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
osh.logging=true

# === Actuator ===
# \ud1b5\ud569 \uac8c\uc774\ud2b8\uc6e8\uc774\uc5d0\uc11c /osh/actuator/* \ub294 \ucc28\ub2e8\uc744 \uad8c\uc7a5. \uc560\ud50c \uc790\uccb4 \ub178\ucd9c\ub3c4 \ucd5c\uc18c\ud654.
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSE:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:when-authorized}

# Disable JDBC auto-configuration for news database
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# === Gemini ===
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}

# === \uc678\ubd80 API \ud0a4 ===
# \ud0a4\ub294 git \uc800\uc7a5\uc18c\uc5d0 \ub450\uc9c0 \uc54a\ub294\ub2e4. \uc6b4\uc601 \ub2e8\uc6d0\uc740 \ud658\uacbd\ubcc0\uc218\ub85c \uc8fc\uc785:
#   OPENWEATHER_API_KEY, ITS_TRAFFIC_API_KEY, SAFETY_EMERGENCY_API_KEY, SAFETY_NEWS_API_KEY
# \ub85c\uceec \uac1c\ubc1c \uc2dc\uc5d0\ub294 application-local.properties (.gitignore \ub300\uc0c1)\uc73c\ub85c \ub36e\uc5b4\uc4f0\uae30 \uad8c\uc7a5.
osh.api.openweather.key=${OPENWEATHER_API_KEY:}
osh.api.its-traffic.key=${ITS_TRAFFIC_API_KEY:}
osh.api.safety-emergency.key=${SAFETY_EMERGENCY_API_KEY:}
osh.api.safety-news.key=${SAFETY_NEWS_API_KEY:}
