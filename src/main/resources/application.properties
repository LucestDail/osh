# Application Name
spring.application.name=osh

# Primary Database Configuration
spring.datasource.url=jdbc:mysql://REDACTED_DB_HOST:53306/dailydata?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
spring.datasource.username=REDACTED
spring.datasource.password=REDACTED
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Configuration for Primary DataSource
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# News Database Configuration
spring.datasource.news.jdbc-url=jdbc:mysql://REDACTED_DB_HOST:53306/mytools?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
spring.datasource.news.username=REDACTED
spring.datasource.news.password=REDACTED
spring.datasource.news.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Configuration for News DataSource
spring.datasource.news.hikari.connection-timeout=30000
spring.datasource.news.hikari.maximum-pool-size=5
spring.datasource.news.hikari.minimum-idle=1
spring.datasource.news.hikari.idle-timeout=600000
spring.datasource.news.hikari.max-lifetime=1800000
spring.datasource.news.hikari.connection-test-query=SELECT 1
spring.datasource.news.hikari.validation-timeout=5000
spring.datasource.news.hikari.leak-detection-threshold=60000

# Primary JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# News JPA Configuration
spring.jpa.news.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.news.show-sql=true
spring.jpa.news.hibernate.ddl-auto=none
spring.jpa.news.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.root=INFO
logging.level.com.project.osh=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
osh.logging=true

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Disable JDBC auto-configuration for news database
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# gemini api key
gemini.api.key=test
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent